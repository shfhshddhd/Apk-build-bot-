name: Validate APK Build Bot

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  syntax-check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python source
        run: python -m py_compile bot.py
      - name: Check framework detection and build paths
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('bot.py').read_text()
          required = [
              'if "expo" in deps:',
              'return root, "cordova", "Apache Cordova"',
              'npx expo prebuild --platform android --no-install',
              'npx --yes cordova platform add android',
              'root.rglob(pattern)',
              'engine in ("react-native", "capacitor", "expo", "cordova")',
              'MAX_ZIP_FILES = 50000',
              'MAX_UNZIPPED_BYTES = 2 * 1024 * 1024 * 1024',
              'def telegram_archive_branch(url: str):',
              'def clone_telegram_source(destination: Path, branch: str):',
              '"--recurse-submodules", "--shallow-submodules"',
              'return folder, "telegram", "Telegram Android (with submodules)"',
              "sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'",
              'assembleAfatDebug',
              'timeout_seconds = 5400 if engine == "telegram" else BUILD_TIMEOUT_SECONDS',
          ]
          missing = [item for item in required if item not in source]
          if missing:
              raise SystemExit('Missing framework/build path: ' + ', '.join(missing))
          print('Framework detection/build path checks passed.')
          PY
      - name: Check required 200 MB download protections
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('bot.py').read_text()
          required = [
              'MAX_ZIP_BYTES = 200 * 1024 * 1024',
              'def validate_public_https_url(',
              'def download_zip_url(',
              'written > MAX_ZIP_BYTES',
              'filters.TEXT & ~filters.COMMAND, receive_url',
          ]
          missing = [item for item in required if item not in source]
          if missing:
              raise SystemExit('Missing required protection/handler: ' + ', '.join(missing))
          print('Syntax, direct-download guards, ZIP limits, and Telegram build-path checks passed.')
          PY
