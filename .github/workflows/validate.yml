name: Validate APK Build Bot

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-apk-build-bot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install bot dependencies
        run: pip install -r requirements.txt

      - name: Compile Python modules
        run: python -m py_compile bot.py project_inspector.py build_adapters.py build_preflight.py build_history.py

      - name: Run project-inspection regression tests
        run: python -m unittest discover -s tests -v

      - name: Verify critical safety and artifact checks exist
        run: |
          python - <<'PY'
          from pathlib import Path
          bot = Path("bot.py").read_text(encoding="utf-8")
          inspector = Path("project_inspector.py").read_text(encoding="utf-8")
          adapters = Path("build_adapters.py").read_text(encoding="utf-8")
          preflight = Path("build_preflight.py").read_text(encoding="utf-8")
          history = Path("build_history.py").read_text(encoding="utf-8")
          required_bot = [
              "MAX_ZIP_BYTES = int(os.environ.get",
              "MAX_UNZIPPED_BYTES = int(os.environ.get",
              "MAX_APK_BYTES = int(os.environ.get",
              "def safe_extract(",
              "def validate_public_https_url(",
              "def download_zip_url(",
              "artifact.testzip()",
              'if "AndroidManifest.xml" not in artifact.namelist()',
              'for output_dir in root.rglob("outputs/apk")',
              '["docker", "rm", "-f", container_name]',
              '"--name", container_name',
              "hashlib.sha256()",
          ]
          required_inspector = [
              "def detect_project(",
              'return root, "flutter", "Flutter"',
              'return root, "expo", "Expo (React Native)"',
              'return root, "react-native", "React Native"',
              'return root, "capacitor", "Ionic/Capacitor"',
              "MAX_INSPECTED_FILES",
          ]
          missing = [f"bot.py: {x}" for x in required_bot if x not in bot]
          required_features = [
              "inspect_project", "record_build", "recent_builds",
              "CommandHandler(\"history\", history_command)",
          ]
          missing += [f"bot.py feature: {x}" for x in required_features if x not in bot]
          missing += [f"build_preflight.py: {x}" for x in ("def inspect_project(", "def format_findings(") if x not in preflight]
          missing += [f"build_history.py: {x}" for x in ("CREATE TABLE IF NOT EXISTS builds", "def recent_builds(") if x not in history]
          missing += [f"project_inspector.py: {x}" for x in required_inspector if x not in inspector]
          required_adapters = [
              "def build_command_for(",
              "prepare_android_sdk",
              "restore_gradle_wrapper",
              "compileSdk",
          ]
          missing += [f"build_adapters.py: {x}" for x in required_adapters if x not in adapters]
          if missing:
              raise SystemExit("Missing required checks: " + ", ".join(missing))
          print("Critical safety, detection, and artifact checks are present.")
          PY
