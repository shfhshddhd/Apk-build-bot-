name: APK Build Bot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  telegram-bot:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Check Docker
        run: docker info

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Start Telegram APK bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ALLOWED_USER_IDS: ${{ secrets.ALLOWED_USER_IDS }}
          DOCKER_IMAGE: ghcr.io/cirruslabs/android-sdk:35
        run: python bot.py
