name: APK Build Bot

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-build-bot-singleton
  cancel-in-progress: false

jobs:
  telegram-bot:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Cloudflare Tunnel for large-APK fallback
        run: |
          curl --fail --location --retry 3 --retry-delay 2 https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /usr/local/bin/cloudflared
          chmod +x /usr/local/bin/cloudflared
          cloudflared --version

      - name: Validate bot Python syntax
        run: python -m py_compile bot.py

      - name: Start Telegram APK bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ALLOWED_USER_IDS: ${{ secrets.ALLOWED_USER_IDS }}
          DOCKER_IMAGE: ghcr.io/cirruslabs/android-sdk:35
          FLUTTER_IMAGE: ghcr.io/cirruslabs/flutter:stable
        run: python bot.py
